# Builds an UNSIGNED iOS .ipa on a macOS runner (Windows cannot build iOS apps).
# Sign + install it with your own Apple ID, e.g. Sideloadly / AltStore, or re-sign with a
# paid developer account. Run manually: Actions > "iOS build" > Run workflow.
name: iOS build

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-ios

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          # only the iOS template is needed here
          cp /tmp/tpl/templates/ios.zip /tmp/tpl/templates/version.txt "$dest/"

      - name: Import project
        run: |
          GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --path . --import || true

      - name: Export Xcode project
        run: |
          set -e
          GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/NightShift.ipa
          ls build/ios

      - name: Build unsigned app
        run: |
          set -eo pipefail
          xcodebuild -project build/ios/NightShift.xcodeproj -scheme NightShift \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -n 40

      - name: Package .ipa
        run: |
          set -e
          app=$(find build/dd/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "app: $app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry NightShift-unsigned.ipa Payload
          ls -lh NightShift-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-ios-unsigned
          path: NightShift-unsigned.ipa
          retention-days: 14
